<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハラスメントアンケート 集計・CSV出力</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: "Meiryo UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border: 1px solid #d0d7de;
    }
    h1 {
      font-size: 1.3rem;
      margin-top: 0;
      border-bottom: 2px solid #2b579a;
      padding-bottom: 8px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 16px 0 20px;
    }
    button {
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .btn-reload {
      background: #e5e7eb;
      color: #111827;
    }
    .btn-csv {
      background: #2b579a;
      color: #fff;
    }
    .btn-csv:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .count-box {
      margin-left: auto;
      font-weight: bold;
      color: #374151;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d1d5db;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      white-space: nowrap;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 8px 10px;
      text-align: left;
    }
    th {
      background: #eef2f6;
      font-weight: bold;
    }
    .msg {
      margin-top: 12px;
      font-size: 0.92rem;
      color: #374151;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ハラスメントアンケート 集計・CSV出力</h1>

  <div class="toolbar">
    <button type="button" id="reloadBtn" class="btn-reload">最新データを再読み込み</button>
    <button type="button" id="csvBtn" class="btn-csv" disabled>CSVダウンロード（Excel用）</button>
    <div class="count-box" id="countBox">回答件数：0件</div>
  </div>

  <div id="statusMsg" class="msg">データを読み込み中...</div>

  <div class="table-wrap">
    <table id="resultTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>回答日時</th>
          <th>基本情報</th>
          <th>Q1 方針・窓口認知</th>
          <th>Q2 パワハラ</th>
          <th>Q3 セクハラ</th>
          <th>Q4 マタハラ</th>
          <th>Q5 カスハラ</th>
          <th>Q6 発生しにくさ</th>
          <th>Q7 相談しやすさ</th>
          <th>Q8 自由記述</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</div>

<script>
  // ★既存のSupabaseプロジェクトのURLとキーに書き換えてください
const SUPABASE_URL = 'https://ffpuqxyufqugotivqkgi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_5247tSd7ptdrSv6y0972rA_zm_6t99i';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let latestRows = [];

  function formatDateTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    return d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
  }

  function escapeCsvCell(val) {
    const str = val === null || val === undefined ? '' : String(val);
    return '"' + str.replace(/"/g, '""') + '"';
  }

  async function loadResponses() {
    const statusMsg = document.getElementById('statusMsg');
    const tbody = document.getElementById('resultBody');
    const countBox = document.getElementById('countBox');
    const csvBtn = document.getElementById('csvBtn');

    statusMsg.textContent = 'データを読み込み中...';
    csvBtn.disabled = true;

    const { data, error } = await supabaseClient
      .from('harassment_survey')
      .select('*')
      .order('id', { ascending: true });

    if (error) {
      statusMsg.textContent = '読み込みエラー：' + error.message;
      return;
    }

    latestRows = data || [];
    countBox.textContent = '回答件数：' + latestRows.length + '件';
    tbody.innerHTML = '';

    latestRows.forEach(row => {
      const tr = document.createElement('tr');
      const cells = [
        row.id,
        formatDateTime(row.created_at),
        row.basic_role,
        row.q1_policy,
        row.q2_power,
        row.q3_sexual,
        row.q4_maternity,
        row.q5_customer,
        row.q6_env_prevent,
        row.q7_env_consult,
        row.q8_comment || ''
      ];
      cells.forEach(c => {
        const td = document.createElement('td');
        td.textContent = c;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    if (latestRows.length === 0) {
      statusMsg.textContent = 'まだ回答データはありません。';
    } else {
      statusMsg.textContent = '読み込み完了。CSVダウンロードボタンから保存できます。';
      csvBtn.disabled = false;
    }
  }

  function downloadCsv() {
    if (latestRows.length === 0) return;

    const headers = [
      'ID',
      '回答日時',
      '基本情報',
      'Q1_方針・窓口認知',
      'Q2_パワハラ',
      'Q3_セクハラ',
      'Q4_マタハラ',
      'Q5_カスハラ',
      'Q6_発生しにくさ',
      'Q7_相談しやすさ',
      'Q8_自由記述'
    ];

    const lines = [headers.map(escapeCsvCell).join(',')];

    latestRows.forEach(row => {
      const values = [
        row.id,
        formatDateTime(row.created_at),
        row.basic_role,
        row.q1_policy,
        row.q2_power,
        row.q3_sexual,
        row.q4_maternity,
        row.q5_customer,
        row.q6_env_prevent,
        row.q7_env_consult,
        row.q8_comment || ''
      ];
      lines.push(values.map(escapeCsvCell).join(','));
    });

    // Excelで日本語が文字化けしないよう UTF-8 BOM を付与
    const bom = '\uFEFF';
    const blob = new Blob([bom + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);

    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const filename = `${y}${m}${d}_ハラスメントアンケート結果.csv`;

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('reloadBtn').addEventListener('click', loadResponses);
  document.getElementById('csvBtn').addEventListener('click', downloadCsv);

  loadResponses();
</script>

</body>
</html>
